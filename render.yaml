# Render blueprint (AP hosting): one-click staging backend. Connect the repo in Render
# Dashboard → New → Blueprint, then set the secrets below (never committed).
services:
  - type: web
    name: agentic-ops-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: staging
      - key: AUTH_MODE
        value: dev
      - key: DEV_TENANT
        value: tenant-staging-01
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-ops-db
          property: connectionString
      - key: DEV_TOKEN
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: liquid/lfm-2.5-2.6b:free

databases:
  - name: agentic-ops-db
    databaseName: platform
    plan: free
