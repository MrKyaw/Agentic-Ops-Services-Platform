app = "agentic-ops-neo4j"
primary_region = "ord"

[build]
  image = "neo4j:5-community"

# Auth comes from `fly secrets set NEO4J_AUTH=neo4j/<password>` (never committed).

[[mounts]]
  source = "neodata"
  destination = "/data"

# No [[services]] block: private-only over .internal:7687 (trial orgs cannot
# allocate public IPs; the API reaches Neo4j on the private network).
