app = "agentic-ops-graph"
primary_region = "ord"

[build]
  image = "neo4j:5-community"

[env]
  NEO4J_AUTH = "neo4j/${NEO4J_PASSWORD}"

[[mounts]]
  source = "neodata"
  destination = "/data"

[[services]]
  internal_port = 7687
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
