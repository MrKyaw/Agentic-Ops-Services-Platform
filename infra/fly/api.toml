app = "agentic-ops-api"
primary_region = "ord"

# Deploy from the REPO ROOT:
#   fly deploy --config infra/fly/api.toml --dockerfile backend/Dockerfile
# (context must be the repo root so backend/app, backend/migrations resolve)

[build]

[env]
  ENV = "staging"
  AUTH_MODE = "dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048
