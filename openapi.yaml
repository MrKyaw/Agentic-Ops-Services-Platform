components:
  schemas:
    AgentCreate:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 3
          pattern: ^[a-z0-9][a-z0-9-]*$
          title: Id
        displayName:
          type: string
          maxLength: 128
          minLength: 1
          title: Displayname
        pattern:
          type: string
          enum:
          - react
          - rewoo
          title: Pattern
          default: react
      type: object
      required:
      - id
      - displayName
      title: AgentCreate
    AgentOut:
      properties:
        id:
          type: string
          title: Id
        tenantId:
          type: string
          title: Tenantid
        displayName:
          type: string
          title: Displayname
        pattern:
          type: string
          title: Pattern
        version:
          type: string
          title: Version
          default: 0.1.0
        status:
          type: string
          title: Status
          default: draft
      type: object
      required:
      - id
      - tenantId
      - displayName
      - pattern
      title: AgentOut
    CanaryIn:
      properties:
        version_a:
          type: string
          title: Version A
          default: 0.1.0
        version_b:
          type: string
          title: Version B
          default: 0.1.0
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: CanaryIn
    ClassifyIn:
      properties:
        text:
          type: string
          title: Text
        instruction_id:
          type: string
          title: Instruction Id
          default: ''
      type: object
      required:
      - text
      title: ClassifyIn
    ConsentIn:
      properties:
        subject:
          type: string
          title: Subject
        purpose:
          type: string
          title: Purpose
        granted:
          type: boolean
          title: Granted
          default: true
        policy_version:
          type: string
          title: Policy Version
          default: v1
      type: object
      required:
      - subject
      - purpose
      title: ConsentIn
    CorrectionIn:
      properties:
        text:
          type: string
          title: Text
        predicted:
          type: string
          title: Predicted
        correct:
          type: string
          title: Correct
      type: object
      required:
      - text
      - predicted
      - correct
      title: CorrectionIn
    DecideIn:
      properties:
        decision:
          type: string
          title: Decision
      type: object
      required:
      - decision
      title: DecideIn
    DraftIn:
      properties:
        objective:
          type: string
          minLength: 10
          title: Objective
        decision_rules:
          items:
            type: string
          type: array
          title: Decision Rules
          default: []
        escalation:
          type: string
          title: Escalation
          default: human approval for writes
        pattern:
          type: string
          title: Pattern
          default: react
      type: object
      required:
      - objective
      title: DraftIn
    ExperimentIn:
      properties:
        subject_type:
          type: string
          pattern: ^(prompt|retrieval|agent|model)$
          title: Subject Type
        subject_ref:
          type: string
          title: Subject Ref
          default: ''
        params:
          additionalProperties: true
          type: object
          title: Params
          default: {}
        metrics:
          additionalProperties: true
          type: object
          title: Metrics
          default: {}
      type: object
      required:
      - subject_type
      title: ExperimentIn
    FlagIn:
      properties:
        key:
          type: string
          title: Key
        value:
          additionalProperties: true
          type: object
          title: Value
          default: {}
      type: object
      required:
      - key
      title: FlagIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IngestIn:
      properties:
        kb_id:
          type: string
          title: Kb Id
          default: kb-policy
        doc_id:
          type: string
          title: Doc Id
        title:
          type: string
          title: Title
          default: ''
        content:
          type: string
          minLength: 1
          title: Content
        acl:
          items:
            type: string
          type: array
          title: Acl
          default: []
      type: object
      required:
      - doc_id
      - content
      title: IngestIn
    KillIn:
      properties:
        scope:
          type: string
          title: Scope
        'on':
          type: boolean
          title: 'On'
          default: true
      type: object
      required:
      - scope
      title: KillIn
    ModelIn:
      properties:
        id:
          type: string
          title: Id
        version:
          type: string
          title: Version
          default: '1.0'
        backend:
          type: string
          title: Backend
          default: local-standin
        risk_tier:
          type: string
          title: Risk Tier
          default: low
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          default: {}
      type: object
      required:
      - id
      title: ModelIn
    PromoteIn:
      properties:
        business_metric:
          type: string
          title: Business Metric
        baseline:
          type: string
          title: Baseline
        target:
          type: string
          title: Target
      type: object
      required:
      - business_metric
      - baseline
      - target
      title: PromoteIn
    PromptCreate:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 3
          pattern: ^[a-z0-9][a-z0-9-]*$
          title: Id
        template:
          type: string
          minLength: 1
          title: Template
        variables:
          items:
            type: string
          type: array
          title: Variables
          default: []
        risk:
          type: string
          title: Risk
          default: low
      type: object
      required:
      - id
      - template
      title: PromptCreate
    PurgeIn:
      properties:
        older_than_days:
          type: integer
          title: Older Than Days
          default: 90
      type: object
      title: PurgeIn
    QueryIn:
      properties:
        kb_id:
          type: string
          title: Kb Id
          default: kb-policy
        query:
          type: string
          minLength: 1
          title: Query
        top_k:
          type: integer
          title: Top K
          default: 5
        citations:
          type: boolean
          title: Citations
          default: true
        strategy:
          type: string
          title: Strategy
          default: auto
        config:
          type: string
          title: Config
          default: ''
      type: object
      required:
      - query
      title: QueryIn
    QuotasIn:
      properties:
        rpm:
          type: integer
          title: Rpm
          default: 60
        runs_per_day:
          type: integer
          title: Runs Per Day
          default: 1000
      type: object
      title: QuotasIn
    RetrievalConfigIn:
      properties:
        id:
          type: string
          title: Id
        strategy:
          type: string
          title: Strategy
          default: auto
        top_k:
          type: integer
          title: Top K
          default: 5
        min_faithfulness:
          type: number
          title: Min Faithfulness
          default: 0.0
      type: object
      required:
      - id
      title: RetrievalConfigIn
    RunIn:
      properties:
        agent_id:
          type: string
          title: Agent Id
          default: pilot-triage
        input:
          additionalProperties: true
          type: object
          title: Input
        mode:
          type: string
          title: Mode
          default: sync
      type: object
      title: RunIn
    TenantCreate:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 3
          pattern: ^[a-z0-9][a-z0-9-]*$
          title: Id
        name:
          type: string
          maxLength: 128
          minLength: 1
          title: Name
      type: object
      required:
      - id
      - name
      title: TenantCreate
    TenantOut:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        status:
          type: string
          enum:
          - active
          - suspended
          title: Status
          default: active
      type: object
      required:
      - id
      - name
      title: TenantOut
    TenantUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Name
        status:
          anyOf:
          - type: string
            enum:
            - active
            - suspended
          - type: 'null'
          title: Status
      type: object
      title: TenantUpdate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WebhookIn:
      properties:
        id:
          type: string
          title: Id
        url:
          type: string
          title: Url
        events:
          items:
            type: string
          type: array
          title: Events
          default: []
      type: object
      required:
      - id
      - url
      title: WebhookIn
