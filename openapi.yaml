components:
  schemas:
    AgentCreate:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 3
          pattern: ^[a-z0-9][a-z0-9-]*$
          title: Id
        displayName:
          type: string
          maxLength: 128
          minLength: 1
          title: Displayname
        pattern:
          type: string
          enum:
          - react
          - rewoo
          title: Pattern
          default: react
      type: object
      required:
      - id
      - displayName
      title: AgentCreate
    AgentOut:
      properties:
        id:
          type: string
          title: Id
        tenantId:
          type: string
          title: Tenantid
        displayName:
          type: string
          title: Displayname
        pattern:
          type: string
          title: Pattern
        version:
          type: string
          title: Version
          default: 0.1.0
        status:
          type: string
          title: Status
          default: draft
      type: object
      required:
      - id
      - tenantId
      - displayName
      - pattern
      title: AgentOut
    ClassifyIn:
      properties:
        text:
          type: string
          title: Text
        instruction_id:
          type: string
          title: Instruction Id
          default: ''
      type: object
      required:
      - text
      title: ClassifyIn
    DecideIn:
      properties:
        decision:
          type: string
          title: Decision
      type: object
      required:
      - decision
      title: DecideIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IngestIn:
      properties:
        kb_id:
          type: string
          title: Kb Id
          default: kb-policy
        doc_id:
          type: string
          title: Doc Id
        title:
          type: string
          title: Title
          default: ''
        content:
          type: string
          minLength: 1
          title: Content
        acl:
          items:
            type: string
          type: array
          title: Acl
          default: []
      type: object
      required:
      - doc_id
      - content
      title: IngestIn
    KillIn:
      properties:
        scope:
          type: string
          title: Scope
        'on':
          type: boolean
          title: 'On'
          default: true
      type: object
      required:
      - scope
      title: KillIn
    PromptCreate:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 3
          pattern: ^[a-z0-9][a-z0-9-]*$
          title: Id
        template:
          type: string
          minLength: 1
          title: Template
        variables:
          items:
            type: string
          type: array
          title: Variables
          default: []
      type: object
      required:
      - id
      - template
      title: PromptCreate
    QueryIn:
      properties:
        kb_id:
          type: string
          title: Kb Id
          default: kb-policy
        query:
          type: string
          minLength: 1
          title: Query
        top_k:
          type: integer
          title: Top K
          default: 5
        citations:
          type: boolean
          title: Citations
          default: true
        strategy:
          type: string
          title: Strategy
          default: auto
      type: object
      required:
      - query
      title: QueryIn
    QuotasIn:
      properties:
        rpm:
          type: integer
          title: Rpm
          default: 60
        runs_per_day:
          type: integer
          title: Runs Per Day
          default: 1000
      type: object
      title: QuotasIn
    RunIn:
      properties:
        agent_id:
          type: string
          title: Agent Id
          default: pilot-triage
        input:
          additionalProperties: true
          type: object
          title: Input
        mode:
          type: string
          title: Mode
          default: sync
      type: object
      title: RunIn
    TenantCreate:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 3
          pattern: ^[a-z0-9][a-z0-9-]*$
          title: Id
        name:
          type: string
          maxLength: 128
          minLength: 1
          title: Name
      type: object
      required:
      - id
      - name
      title: TenantCreate
    TenantOut:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        status:
          type: string
          enum:
          - active
          - suspended
          title: Status
          default: active
      type: object
      required:
      - id
      - name
      title: TenantOut
    TenantUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Name
        status:
          anyOf:
          - type: string
            enum:
            - active
            - suspended
          - type: 'null'
          title: Status
      type: object
      title: TenantUpdate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
